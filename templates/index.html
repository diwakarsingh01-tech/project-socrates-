<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Socrates Training Platform</title>
    <script src="/static/vendor/socket.io.min.js"></script>
    <script src="/static/vendor/react.development.js" crossorigin></script>
    <script src="/static/vendor/react-dom.development.js" crossorigin></script>
    <script src="/static/vendor/babel.min.js"></script>
    <script src="/static/vendor/tailwindcss.js"></script>
    <link rel="stylesheet" href="/static/vendor/font-awesome/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Socrates AI">
    <meta name="theme-color" content="#090D16">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        socrates: {
                            primary: '#D97706',
                            primaryHover: '#B45309',
                            dark: '#090D16',
                            light: '#F3F6FA',
                            accent: '#10B981',
                            border: 'rgba(255,255,255,0.06)',
                            text: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap');

        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        html, body { 
            font-family: 'Inter', sans-serif; 
            background-color: #090D16; 
            color: #F8FAFC;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Lock scroll to internal containers */
            -webkit-tap-highlight-color: transparent;
        }

        .font-outfit { font-family: 'Outfit', sans-serif; }

        .card { 
            background: rgba(13, 17, 28, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(20px);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 50%, #B45309 100%); 
            color: #090D16; 
            border-radius: 18px; 
            padding: 14px 28px; 
            font-weight: 800; 
            font-size: 15px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            box-shadow: 0 4px 20px -2px rgba(217,119,6,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            outline: none; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-primary:active { transform: scale(0.97); }

        .btn-outline { 
            border: 1.5px solid rgba(255, 255, 255, 0.08); 
            background: rgba(255, 255, 255, 0.02); 
            color: #E2E8F0; 
            border-radius: 18px; 
            padding: 13px 28px; 
            font-weight: 700; 
            font-size: 15px; 
            transition: all 0.2s ease; 
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .input-field { 
            border: 1.5px solid rgba(255, 255, 255, 0.05); 
            border-radius: 18px; 
            padding: 14px 20px; 
            font-size: 15px; 
            width: 100%; 
            outline: none; 
            transition: all 0.25s ease; 
            background: rgba(255, 255, 255, 0.03); 
            color: #F8FAFC;
        }
        .input-field:focus { 
            border-color: #D97706; 
            background: rgba(255, 255, 255, 0.05); 
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15); 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }
        .animate-fall { animation: fall linear infinite; }

        .backdrop-blur-header {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(9, 13, 22, 0.7);
        }

        /* Auto-set height helper */
        .vh-fix { height: 100dvh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    {% raw %}
        const { useState, useEffect, useRef } = React;
        const socket = io();

        const cleanQuestionText = (text) => {
            if (typeof text !== 'string') return text;
            return text.replace(/^\[[^\]]+\]\s*/g, '').trim();
        };

        const cleanOptionText = (opt) => {
            if (typeof opt !== 'string') return opt;
            return opt.replace(/^(Option\s+[A-D][:.-]?\s*|[A-D][:.-]\s*)/i, '').trim();
        };

        const fallbackQuestions = {
            'zero day': {
                question: "What is the maximum LTV ratio allowed for a standard Two-Wheeler loan?",
                options: ["75%", "85%", "90%", "100%"],
                correctIndex: 1
            },
            'six days': {
                question: "What is the minimum CIBIL score required for a 90% LTV approval?",
                options: ["650", "700", "750", "800"],
                correctIndex: 2
            },
            'twenty days': {
                question: "Which document is mandatory for a loan amount exceeding ₹2 Lakhs?",
                options: ["Electricity Bill", "Rent Agreement", "ITR / Form 16", "Passport"],
                correctIndex: 2
            }
        };

        const App = () => {
            const [view, setView] = useState(() => localStorage.getItem('socrates_view') || 'login'); 
            const [empId, setEmpId] = useState(() => localStorage.getItem('socrates_empId') || '');
            const [empDetails, setEmpDetails] = useState(() => {
                const saved = localStorage.getItem('socrates_empDetails');
                return saved ? JSON.parse(saved) : null;
            });
            const [pin, setPin] = useState(() => localStorage.getItem('socrates_pin') || '');
            const [joinError, setJoinError] = useState('');

            useEffect(() => {
                const urlPin = new URLSearchParams(window.location.search).get('pin');
                if (urlPin) setPin(urlPin);
                // Rejoin the socket room after a page reload so live broadcasts
                // (questions, view changes) still reach this trainee screen.
                const restoredPin = urlPin || localStorage.getItem('socrates_pin') || '';
                const restoredEmpId = localStorage.getItem('socrates_empId') || '';
                const restoredView = localStorage.getItem('socrates_view') || 'login';
                if (restoredView !== 'login' && restoredEmpId && restoredPin) {
                    socket.emit('join_session', {pin: restoredPin, emp_id: restoredEmpId});
                    socket.emit('request_sync', {pin: restoredPin});
                }
            }, []);
            const [activeQuestion, setActiveQuestion] = useState(() => localStorage.getItem('socrates_activeQuestion') || '');
            const [activeQIdx, setActiveQIdx] = useState(() => parseInt(localStorage.getItem('socrates_activeQIdx') || '-1'));
            const [activeOptions, setActiveOptions] = useState(() => {
                const saved = localStorage.getItem('socrates_activeOptions');
                return saved ? JSON.parse(saved) : [];
            });
            const [activeModuleId, setActiveModuleId] = useState(() => {
                const saved = localStorage.getItem('socrates_activeModuleId');
                return saved !== null ? parseInt(saved) : 1;
            });
            const [activeModuleTitle, setActiveModuleTitle] = useState(() => localStorage.getItem('socrates_activeModuleTitle') || '');
            const [securityLock, setSecurityLock] = useState(false);
            const [certificateId, setCertificateId] = useState(() => localStorage.getItem('socrates_certificate_id') || '');
            const [passedStatus, setPassedStatus] = useState(() => {
                const saved = localStorage.getItem('socrates_passed_status');
                return saved !== null ? (saved === 'true' || saved === '1') : null;
            });

            const [activeAssignmentDay, setActiveAssignmentDay] = useState(() => localStorage.getItem('socrates_activeAssignmentDay') || 'zero day');
            const [activeTranslations, setActiveTranslations] = useState(() => {
                const saved = localStorage.getItem('socrates_activeTranslations');
                return saved ? JSON.parse(saved) : {};
            });
            const [hasSubmittedCurrent, setHasSubmittedCurrent] = useState(() => localStorage.getItem('socrates_hasSubmittedCurrent') === 'true');

            const [correctCount, setCorrectCount] = useState(() => parseInt(localStorage.getItem('socrates_correctCount') || '0'));
            const [wrongCount, setWrongCount] = useState(() => parseInt(localStorage.getItem('socrates_wrongCount') || '0'));
            const [unattemptedCount, setUnattemptedCount] = useState(() => parseInt(localStorage.getItem('socrates_unattemptedCount') || '0'));

            const [totalQuestions, setTotalQuestions] = useState(() => parseInt(localStorage.getItem('socrates_totalQuestions') || '0'));
            const [moduleTotalQs, setModuleTotalQs] = useState(0);

            // Authoritative server timer snapshot (seconds). Client countdowns
            // only tick down locally; the server re-asserts on every broadcast,
            // join and 10s reconcile, so drift self-corrects.
            const [timerData, setTimerData] = useState({ question_remaining_sec: 0, test_remaining_sec: 0, question_timeout_sec: 60, test_duration_sec: 1200 });

            const [preTestScore, setPreTestScore] = useState(null);
            const [postTestScore, setPostTestScore] = useState(null);

            // MISSION-CRITICAL: Use refs to access current state inside socket listeners without re-registering
            const viewRef = useRef(view);
            const questionRef = useRef(activeQuestion);
            const qIdxRef = useRef(activeQIdx);
            const subRef = useRef(hasSubmittedCurrent);
            // Tracks the last test phase seen so pre->post transitions reset counters.
            const phaseRef = useRef(null);

            useEffect(() => { viewRef.current = view; }, [view]);
            useEffect(() => { questionRef.current = activeQuestion; }, [activeQuestion]);
            useEffect(() => { qIdxRef.current = activeQIdx; }, [activeQIdx]);
            useEffect(() => { subRef.current = hasSubmittedCurrent; }, [hasSubmittedCurrent]);

            useEffect(() => {
                socket.on('change_view', (data) => {
                    const cView = viewRef.current;
                    const cQuestion = questionRef.current;
                    const cQIdx = qIdxRef.current;
                    const cHasSub = subRef.current;

                    const viewChanged = !!data.view && data.view !== cView;
                    if (data.view) {
                        if ((cView === 'pretest' || cView === 'posttest') && !cHasSub && cQuestion && !data.sync) setUnattemptedCount(prev => prev + 1);
                        setView(data.view);
                    }

                    // New test phase (pre->post, or via lock): reset client counters so the
                    // post-test never mixes pre-test counts into scores/certificates.
                    if (data.view === 'pretest' || data.view === 'posttest') {
                        if (phaseRef.current && phaseRef.current !== data.view) {
                            setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0);
                            setTotalQuestions(0); setHasSubmittedCurrent(false);
                        }
                        phaseRef.current = data.view;
                    }

                    const isNewQ = (data.question_idx !== undefined && data.question_idx !== cQIdx) || 
                                   (data.question && data.question !== cQuestion);

                    if (isNewQ) {
                        if (!cHasSub && cQuestion && !data.sync && !viewChanged) setUnattemptedCount(prev => prev + 1);
                        setActiveQuestion(data.question || '');
                        if (data.question_idx !== undefined) setActiveQIdx(data.question_idx);
                        if (!data.sync) setTotalQuestions(prev => prev + 1);
                        setHasSubmittedCurrent(false);
                    }

                    if (data.options) setActiveOptions(data.options);
                    if (data.module_id) setActiveModuleId(data.module_id);
                    if (data.module_title) setActiveModuleTitle(data.module_title);
                    if (data.totalQs) setModuleTotalQs(data.totalQs);
                    if (data.assignment_day) setActiveAssignmentDay(data.assignment_day);
                    if (data.translations) setActiveTranslations(data.translations); else if (data.question) setActiveTranslations({});
                    if (data.question_remaining_sec !== undefined) {
                        setTimerData({ question_remaining_sec: data.question_remaining_sec, test_remaining_sec: data.test_remaining_sec ?? data.test_duration_sec ?? 1200, question_timeout_sec: data.question_timeout_sec ?? 60, test_duration_sec: data.test_duration_sec ?? 1200 });
                    }
                });

                // Full re-sync snapshot: server pushes the canonical question,
                // options and timer so a client that missed a broadcast (network
                // drop, slow device, page refresh) snaps back instead of staying
                // stuck on an old question index.
                socket.on('session_sync', (data) => {
                    if (data.view) {
                        setView(data.view);
                    } else if (viewRef.current === 'pretest' || viewRef.current === 'posttest') {
                        // Server reports no active phase (session was reset or
                        // the service restarted): never leave a student on a
                        // stale quiz. Park them on the dashboard.
                        setView('dashboard');
                        setActiveQuestion(''); setActiveQIdx(-1); setActiveOptions([]);
                        setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0);
                        setTotalQuestions(0); setHasSubmittedCurrent(false);
                        setModuleTotalQs(0); setSecurityLock(false);
                    }
                    if (data.question_idx !== undefined && data.question_idx !== qIdxRef.current) {
                        setActiveQIdx(data.question_idx);
                        setHasSubmittedCurrent(false);
                        if (data.question) setActiveQuestion(data.question);
                        if (data.translations) setActiveTranslations(data.translations); else if (data.question) setActiveTranslations({});
                    } else if (data.question && data.question !== questionRef.current) {
                        setActiveQuestion(data.question);
                        if (data.translations) setActiveTranslations(data.translations); else setActiveTranslations({});
                    }
                    if (data.options) setActiveOptions(data.options);
                    if (data.module_id) setActiveModuleId(data.module_id);
                    if (data.module_title) setActiveModuleTitle(data.module_title);
                    if (data.assignment_day) setActiveAssignmentDay(data.assignment_day);
                    if (data.total_questions) setModuleTotalQs(data.total_questions);
                    if (data.question_remaining_sec !== undefined) {
                        setTimerData({ question_remaining_sec: data.question_remaining_sec, test_remaining_sec: data.test_remaining_sec ?? data.test_duration_sec ?? 1200, question_timeout_sec: data.question_timeout_sec ?? 60, test_duration_sec: data.test_duration_sec ?? 1200 });
                    }
                });

                socket.on('session_info', (data) => {
                    if (data.view) {
                        setView(data.view);
                    } else if (viewRef.current === 'pretest' || viewRef.current === 'posttest') {
                        // Server reports NO active phase (fresh session — trainer
                        // has not clicked Pre-Test/Post-Test yet). Park the
                        // student on the dashboard instead of a stale quiz, so a
                        // QR scan can never show questions before the trainer
                        // actually starts the test.
                        setView('dashboard');
                        setActiveQuestion(''); setActiveQIdx(-1); setActiveOptions([]);
                        setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0);
                        setTotalQuestions(0); setHasSubmittedCurrent(false);
                        setModuleTotalQs(0); setSecurityLock(false);
                        localStorage.removeItem('socrates_activeQuestion');
                        localStorage.removeItem('socrates_activeQIdx');
                    }
                    if (data.module_id) setActiveModuleId(data.module_id);
                    if (data.module_title) setActiveModuleTitle(data.module_title);
                    if (data.assignment_day) setActiveAssignmentDay(data.assignment_day);
                    if (data.total_questions) setModuleTotalQs(data.total_questions);
                    if (data.question_remaining_sec !== undefined) {
                        setTimerData({ question_remaining_sec: data.question_remaining_sec, test_remaining_sec: data.test_remaining_sec ?? data.test_duration_sec ?? 1200, question_timeout_sec: data.question_timeout_sec ?? 60, test_duration_sec: data.test_duration_sec ?? 1200 });
                    }
                });

                // Master-roster gating: the server rejects joins for profiles that
                // are not in the ACTIVE master roster. Revert to login with a clear
                // message instead of silently sitting on an empty dashboard.
                socket.on('join_error', (data) => {
                    setJoinError((data && data.message) || "Profile not found in the master roster. Please contact your administrator.");
                    setView('login');
                    localStorage.removeItem('socrates_empId');
                    localStorage.removeItem('socrates_empDetails');
                    localStorage.removeItem('socrates_view');
                });

                socket.on('client_command', (data) => {
                    if (data.command === 'reset_scores') {
                        setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0); setTotalQuestions(0); setHasSubmittedCurrent(false);
                        setActiveQIdx(-1);
                        setSecurityLock(false);
                        localStorage.removeItem('socrates_correctCount');
                        localStorage.removeItem('socrates_activeQIdx');
                    }
                    if (data.command === 'show_results') {
                        setView('result');
                    }
                });

                return () => { socket.off('change_view'); socket.off('client_command'); socket.off('session_info'); socket.off('session_sync'); };
            }, []);

            // Countdown: only ticks while a timed test is live. Server keeps
            // re-asserting the authoritative remaining time on each broadcast.
            useEffect(() => {
                if (view !== 'pretest' && view !== 'posttest') return;
                const iv = setInterval(() => {
                    setTimerData(prev => {
                        const q = prev.question_remaining_sec > 0 ? prev.question_remaining_sec - 1 : 0;
                        const t = prev.test_remaining_sec > 0 ? prev.test_remaining_sec - 1 : 0;
                        return { ...prev, question_remaining_sec: q, test_remaining_sec: t };
                    });
                }, 1000);
                return () => clearInterval(iv);
            }, [view]);

            // Periodic reconciliation with the server: guarantees a student whose
            // screen missed the trainer's "Next" broadcast catches up automatically.
            useEffect(() => {
                const iv = setInterval(() => { if (pin) socket.emit('request_sync', { pin }); }, 10000);
                return () => clearInterval(iv);
            }, [pin]);

            useEffect(() => {
                localStorage.setItem('socrates_view', view);
                localStorage.setItem('socrates_empId', empId || '');
                localStorage.setItem('socrates_empDetails', JSON.stringify(empDetails));
                localStorage.setItem('socrates_pin', pin || '');
                localStorage.setItem('socrates_activeQuestion', activeQuestion || '');
                localStorage.setItem('socrates_activeQIdx', activeQIdx.toString());
                localStorage.setItem('socrates_activeOptions', JSON.stringify(activeOptions));
                localStorage.setItem('socrates_activeModuleId', activeModuleId);
                localStorage.setItem('socrates_activeModuleTitle', activeModuleTitle || '');
                localStorage.setItem('socrates_activeAssignmentDay', activeAssignmentDay || '');
                localStorage.setItem('socrates_activeTranslations', JSON.stringify(activeTranslations));
                localStorage.setItem('socrates_correctCount', correctCount);
                localStorage.setItem('socrates_wrongCount', wrongCount);
                localStorage.setItem('socrates_unattemptedCount', unattemptedCount);
                localStorage.setItem('socrates_totalQuestions', totalQuestions);
                localStorage.setItem('socrates_hasSubmittedCurrent', hasSubmittedCurrent.toString());
                localStorage.setItem('socrates_certificate_id', certificateId || '');
                localStorage.setItem('socrates_passed_status', passedStatus === null ? '' : passedStatus.toString());
            }, [view, empId, empDetails, pin, activeQuestion, activeQIdx, activeOptions, activeModuleId, activeModuleTitle, activeAssignmentDay, activeTranslations, correctCount, wrongCount, unattemptedCount, totalQuestions, hasSubmittedCurrent, certificateId, passedStatus]);

            const renderContent = () => {
                switch(view) {
                    case 'dashboard': return <Dashboard empDetails={empDetails} assignmentDay={activeAssignmentDay} moduleTitle={activeModuleTitle} />;
                    case 'pretest': 
                    case 'posttest': 
                        return (
                            <Quiz 
                                type={view === 'pretest' ? "Pre-Test" : "Post-Test"}
                                empId={empId} pin={pin} question={activeQuestion} options={activeOptions} moduleId={activeModuleId}
                                assignmentDay={activeAssignmentDay} translations={activeTranslations} counts={{correctCount, wrongCount, unattemptedCount, totalQuestions}}
                                locked={securityLock} onSecurityLock={() => setSecurityLock(true)} totalQs={moduleTotalQs} qIdx={activeQIdx}
                                questionRemaining={timerData.question_remaining_sec} testRemaining={timerData.test_remaining_sec}
                                onResultUpdate={(certId, passed) => {
                                    if (certId) setCertificateId(certId);
                                    if (passed !== undefined && passed !== null) setPassedStatus(passed);
                                }}
                                onScoreSubmit={(score, isCorrect) => {
                                    if (isCorrect) setCorrectCount(prev => prev + 1); else setWrongCount(prev => prev + 1);
                                    if (view === 'pretest') setPreTestScore(score); else setPostTestScore(score);
                                    setHasSubmittedCurrent(true);
                                }}
                            />
                        );
                    case 'training': return <Training assignmentDay={activeAssignmentDay} />;
                    case 'result': 
                        return (
                            <Result 
                                preScore={preTestScore} postScore={postTestScore} counts={{correctCount, wrongCount, unattemptedCount, totalQuestions}}
                                certId={certificateId} passed={passedStatus}
                                empId={empId} pin={pin} moduleTitle={activeModuleTitle} postTestDone={postTestScore !== null}
                                onFinish={() => {
                                    setView('dashboard'); setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0); setTotalQuestions(0);
                                    setHasSubmittedCurrent(false);
                                }} 
                            />
                        );
                    default: return null;
                }
            };

            const handleExit = () => {
                if (!window.confirm('Exit this session and log out?')) return;
                socket.emit('leave_session', {pin: pin, emp_id: empId});
                localStorage.clear();
                setView('login'); setEmpId(''); setEmpDetails(null); setPin('');
                setActiveQuestion(''); setActiveQIdx(-1); setActiveOptions([]); setActiveModuleId(1);
                setActiveModuleTitle('');
                setActiveAssignmentDay('zero day'); setActiveTranslations({});
                setCorrectCount(0); setWrongCount(0); setUnattemptedCount(0); setTotalQuestions(0);
                setHasSubmittedCurrent(false); setCertificateId(''); setPassedStatus(null); setSecurityLock(false);
                setModuleTotalQs(0);
                if (window.location.search) window.history.replaceState({}, '', window.location.pathname);
            };

            if (view === 'login') return <Login joinError={joinError} onLogin={(id, details, sessionPin) => { setJoinError(''); setEmpId(id); setEmpDetails(details); setPin(sessionPin); setView('dashboard'); socket.emit('join_session', {pin: sessionPin, emp_id: id}); }} />;

            return (
                <div className="w-full h-[100dvh] bg-[#090D16] flex flex-col relative overflow-hidden transition-all duration-300">
                    <div className="absolute top-1/4 left-1/4 w-[35rem] h-[35rem] bg-amber-500/5 rounded-full blur-[140px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-[35rem] h-[35rem] bg-yellow-500/3 rounded-full blur-[140px] pointer-events-none"></div>

                    <div className="backdrop-blur-header border-b border-white/5 px-6 py-4 flex justify-between items-center z-50 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-amber-500 to-yellow-600 rounded-2xl flex items-center justify-center text-[#090D16] text-base shadow-lg shadow-amber-500/10 border border-white/10 overflow-hidden"><img src="/static/socrates_mind_logo.jpg" className="w-full h-full object-cover" alt="Socrates Mind" /></div>
                            <span className="font-outfit font-extrabold text-xl tracking-tight text-white">Socrates</span>
                        </div>
                        <div className="flex items-center gap-2.5 bg-white/5 backdrop-blur-xl px-4 py-2 rounded-2xl border border-white/5 shadow-md">
                            <span className="relative flex h-2.5 w-2.5">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#10B981] opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#10B981]"></span>
                            </span>
                            <span className="text-[11px] text-slate-200 font-black tracking-wider uppercase">{empDetails?.emp_name?.split(' ')[0] || 'Trainee'}</span>
                            <button onClick={handleExit} className="ml-1 flex items-center gap-1.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-rose-500/20 transition-all active:scale-95">
                                <i className="fas fa-sign-out-alt text-xs"></i>
                                <span className="hidden sm:inline">Exit</span>
                            </button>
                        </div>
                    </div>

        const Quiz = ({type, empId, pin, question, options, moduleId, assignmentDay, translations, counts, onScoreSubmit, locked, onSecurityLock, onResultUpdate, totalQs, qIdx, questionRemaining, testRemaining}) => {

            const fmtTime = (s) => {

                const m = Math.floor(sec / 60), ss = sec % 60;
                return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
            };

            // Refs to read fresh state inside socket/visibility listeners that register only once
            const countsRef = useRef(counts);
            useEffect(() => { countsRef.current = counts; }, [counts]);
            const submittedRef = useRef(submitted);
            useEffect(() => { submittedRef.current = submitted; }, [submitted]);
            const lockedRef = useRef(locked);
            useEffect(() => { lockedRef.current = locked; }, [locked]);
            const selectedRef = useRef(null);
            useEffect(() => { selectedRef.current = selected; }, [selected]);
            const onSecurityLockRef = useRef(onSecurityLock);
            useEffect(() => { onSecurityLockRef.current = onSecurityLock; }, [onSecurityLock]);
            const tabSwitchRef = useRef(0);
            const startTimeRef = useRef(Date.now());
            const submitAnswerRef = useRef(null);

            // Real anti-cheat: 3 tab-switch violations lock the assessment AND auto-submit the current answer
            useEffect(() => {
                const handleVisibility = () => {
                    if (document.hidden || submittedRef.current || lockedRef.current) return;
                    const next = tabSwitchRef.current + 1;
                    tabSwitchRef.current = next;
                    setTabSwitchCount(next);
                    if (next >= 3) {
                        alert("⛔ PROCTORING SECURITY LOCK: 3 Tab Switch Violations detected! Auto-submitting assessment.");
                        if (onSecurityLockRef.current) onSecurityLockRef.current();
                        if (submitAnswerRef.current) submitAnswerRef.current();
                    } else {
                        alert(`⚠️ ANTI-CHEAT PROCTORING WARNING (${next}/3): Tab switching or browser focus loss detected! Multi-session violations will lock your test.`);
                    }
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => document.removeEventListener('visibilitychange', handleVisibility);
            }, []);

            const qText = cleanQuestionText(question || (fallbackQuestions[assignmentDay]?.question) || fallbackQuestions['zero day'].question);
            const qOpts = ((options?.length ? options : (fallbackQuestions[assignmentDay]?.options || fallbackQuestions['zero day'].options))).map(cleanOptionText);

            // Authoritative scoring: the server evaluates the answer and confirms via socket.
            // The DB write runs only inside score_confirmation (no client-side answer-key dependence).
            useEffect(() => {
                socket.on('score_confirmation', (data) => {
                    setScoreInfo(data);
                    const isCorrect = !!data.is_correct;
                    onScoreSubmit(100, isCorrect);
                    const c = countsRef.current;
                    const nextCorrect = c.correctCount + (isCorrect ? 1 : 0);
                    const nextWrong = c.wrongCount + (!isCorrect ? 1 : 0);
                    const timeTaken = Math.round((Date.now() - startTimeRef.current) / 1000);
                    fetch('/api/assessments/submit', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            emp_code: empId, module_id: moduleId || 1, assignment_day: assignmentDay,
                            session_id: pin, test_type: type === 'Pre-Test' ? 'pre' : 'post',
                            correct_count: nextCorrect, wrong_count: nextWrong,
                            unattempted_count: c.unattemptedCount, total_questions: c.totalQuestions,
                            tab_switch_count: tabSwitchRef.current, time_taken_seconds: timeTaken
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.certificate_id && onResultUpdate) onResultUpdate(res.certificate_id, res.passed_status);
                    })
                    .catch(err => console.error("Score persistence error:", err));
                });
                return () => socket.off('score_confirmation');
            }, []);

            useEffect(() => { setSelected(null); setSubmitted(false); setScoreInfo(null); }, [question]);

            const submitAnswer = () => {
                if(selected === null || submitted || locked) return;
                setSubmitted(true);
                // question_idx is CRITICAL for the 1-mark model: the server uses it
                // to detect late/skipped answers and to store per-question attempts.
                socket.emit('submit_vote', {pin, emp_id: empId, answer_idx: selected, question_idx: qIdx});
            };
            submitAnswerRef.current = submitAnswer;

            // Auto-submit when the per-question timer expires: the selected
            // option gets locked in; an empty selection is recorded as skipped
            // by the server's skip-on-next logic when the trainer advances.
            useEffect(() => {

                    submitAnswerRef.current();

                                ) : (

                                        <div className={`w-24 h-24 rounded-[32px] flex items-center justify-center text-5xl mx-auto shadow-xl ${scoreInfo.is_correct ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 animate-bounce' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}><i className={`fas ${scoreInfo.is_correct ? 'fa-check-circle' : 'fa-times-circle'}`}></i></div>

                { key: 'q_overall', label: 'Overall satisfaction with this session', icon: 'fa-face-smile' },
                { key: 'q_clarity', label: "Trainer's clarity & communication", icon: 'fa-comments' },
                { key: 'q_knowledge', label: "Trainer's subject knowledge", icon: 'fa-graduation-cap' },
                { key: 'q_relevance', label: 'Relevance of content to your job', icon: 'fa-briefcase' },
                { key: 'q_pace', label: 'Pace of the session', icon: 'fa-gauge-high' },
            ];
            const [ratings, setRatings] = useState({});
            const [liked, setLiked] = useState('');
            const [improve, setImprove] = useState('');
            const [submitted, setSubmitted] = useState(null);
            const [saving, setSaving] = useState(false);
            const [dismissed, setDismissed] = useState(false);

            // Refresh-proof: if this trainee already rated this session, don't re-show the form.
            useEffect(() => {
                fetch(`/api/feedback/status?emp_code=${encodeURIComponent(empId)}&session_id=${encodeURIComponent(pin)}`)
                    .then(r => r.json())
                    .then(d => setSubmitted(!!d.submitted))
                    .catch(() => setSubmitted(false));
            }, [empId, pin]);

            if (dismissed) return null;

            const submit = () => {
                if (!ratings.q_overall || saving) return;
                setSaving(true);
                fetch('/api/feedback/submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emp_code: empId, session_id: pin, ...ratings, liked, improve, comments: '' })
                })
                    .then(r => r.json())
                    .then(() => { setSubmitted(true); if (onSubmitted) onSubmitted(); })
                    .catch(() => setSaving(false));
            };

            const stars = (key) => (
                <div className="flex items-center gap-1.5">
                    {[1,2,3,4,5].map(v => (
                        <button key={v} onClick={() => setRatings(prev => ({ ...prev, [key]: v }))} className={`text-xl sm:text-2xl transition-all active:scale-90 ${(ratings[key] || 0) >= v ? 'text-amber-400 drop-shadow' : 'text-slate-600 hover:text-slate-400'}`}>
                            <i className="fas fa-star"></i>
                        </button>
                    ))}
                    <span className="text-[10px] font-black text-slate-500 ml-1 uppercase tracking-widest">{ratings[key] ? `${ratings[key]}/5` : 'Tap to rate'}</span>
                </div>
            );

            return (
                <div className="w-full bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-8 space-y-6 animate-fade-in text-left">
                    {submitted ? (
                        <div className="flex flex-col items-center text-center gap-3 py-6">
                            <div className="w-16 h-16 rounded-3xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-3xl text-emerald-400"><i className="fas fa-heart"></i></div>
                            <h4 className="font-outfit font-black text-lg text-white uppercase tracking-widest">Feedback Received</h4>
                            <p className="text-xs text-slate-400 font-bold">Thank you for rating this session — your input helps improve training quality.</p>
                        </div>
                    ) : (
                        <>
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <h4 className="font-outfit font-black text-white uppercase tracking-widest text-sm border-l-4 border-amber-500 pl-3">Rate Your Training Session</h4>
                                    <p className="text-[11px] text-slate-400 font-bold mt-2">{moduleTitle || 'Live Module'} — your honest feedback is valued.</p>
                                </div>
                                <button onClick={() => setDismissed(true)} className="text-[10px] font-black text-slate-500 hover:text-slate-300 uppercase tracking-widest shrink-0"><i className="fas fa-times mr-1"></i>Skip</button>
                            </div>
                            <div className="space-y-4">
                                {QUESTIONS.map(q => (
                                    <div key={q.key} className="bg-slate-900/40 rounded-2xl p-4 border border-white/5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                        <span className="text-[12px] font-bold text-slate-200 flex items-center gap-2.5"><i className={`fas ${q.icon} text-amber-400 w-4 text-center`}></i>{q.label}</span>
                                        {stars(q.key)}
                                    </div>
                                ))}
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">What did you like most? <span className="text-slate-600 normal-case">(optional)</span></label>
                                    <textarea value={liked} onChange={e => setLiked(e.target.value)} rows="2" placeholder="Best part of the session..." className="w-full bg-slate-900/40 border border-white/10 rounded-2xl p-4 text-[13px] font-bold text-white placeholder:text-slate-600 focus:border-amber-500/40 focus:outline-none transition-all resize-none"></textarea>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">What can be improved? <span className="text-slate-600 normal-case">(optional)</span></label>
                                    <textarea value={improve} onChange={e => setImprove(e.target.value)} rows="2" placeholder="Suggestions for improvement..." className="w-full bg-slate-900/40 border border-white/10 rounded-2xl p-4 text-[13px] font-bold text-white placeholder:text-slate-600 focus:border-amber-500/40 focus:outline-none transition-all resize-none"></textarea>
                                </div>
                            </div>
                            <button onClick={submit} disabled={!ratings.q_overall || saving} className={`w-full h-14 rounded-2xl font-black text-sm tracking-widest transition-all ${ratings.q_overall && !saving ? 'btn-primary shadow-xl shadow-amber-500/25' : 'bg-white/5 text-slate-600 border border-white/5 cursor-not-allowed'}`}>
                                {saving ? <span className="flex items-center justify-center gap-2"><i className="fas fa-circle-notch fa-spin"></i> SUBMITTING...</span> : 'SUBMIT FEEDBACK'}
                            </button>
                            {!ratings.q_overall && <p className="text-[10px] text-slate-500 font-bold text-center -mt-2">Rate the overall session to submit</p>}
                        </>
                    )}
                </div>
            );
        };

        const Result = ({preScore, postScore, counts, certId, passed, onFinish, empId, pin, moduleTitle, postTestDone}) => (
            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-10 animate-fade-in">
                <div className="w-28 h-28 bg-gradient-to-tr from-amber-500 to-yellow-400 text-[#090D16] rounded-[40px] flex items-center justify-center text-5xl shadow-2xl shadow-amber-500/20 animate-bounce"><i className="fas fa-trophy"></i></div>
                <div className="space-y-2">
                    <h2 className="font-outfit font-black text-3xl text-white tracking-tight">MISSION COMPLETE</h2>
                    <p className="text-slate-400 font-bold text-xs uppercase tracking-[0.3em]">Knowledge Metrics Recorded</p>
                </div>
                <div className="grid grid-cols-3 gap-4 w-full">
                    {[ 
                        {l:'CORRECT', v:counts.correctCount, border:'border-emerald-500/20 text-emerald-400 bg-emerald-500/5'}, 
                        {l:'WRONG', v:counts.wrongCount, border:'border-rose-500/20 text-rose-400 bg-rose-500/5'}, 
                        {l:'UNATTEMPTED', v:counts.unattemptedCount, border:'border-slate-500/20 text-slate-400 bg-slate-500/5'} 
                    ].map(s => (
                        <div key={s.l} className={`p-5 rounded-[32px] border ${s.border} shadow-sm space-y-1`}>
                            <div className="text-[9px] font-black uppercase tracking-widest">{s.l}</div>
                            <div className="text-3xl font-black text-white font-outfit">{s.v}</div>
                        </div>
                    ))}
                </div>
                <div className="w-full flex justify-between items-center bg-white/5 rounded-2xl px-5 py-4 border border-white/5">
                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest">Score</span>
                    <span className="font-outfit font-black text-xl text-white">{counts.correctCount}/{counts.totalQuestions || '—'} · {counts.totalQuestions ? Math.round((counts.correctCount / counts.totalQuestions) * 100) : 0}%</span>
                </div>
                {postTestDone && <Feedback empId={empId} pin={pin} moduleTitle={moduleTitle} />}
                {passed === false ? (
                    <div className="w-full p-4 rounded-2xl border-2 border-rose-500/30 bg-rose-500/10 text-rose-300 text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2">
                        <i className="fas fa-times-circle"></i> Certificate Not Awarded — score below passing threshold
                    </div>
                ) : (
                    <a 
                        href={`/api/assessments/certificate/${certId || localStorage.getItem('socrates_empId') || 'CERT'}`} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="w-full h-14 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 rounded-2xl flex items-center justify-center font-extrabold text-sm uppercase tracking-widest shadow-xl shadow-amber-500/20 hover:scale-[1.02] active:scale-95 transition-all mb-2 text-decoration-none"
                    >
                        <i className="fas fa-award text-lg mr-2"></i> Download Official Certificate
                    </a>
                )}
                <button onClick={onFinish} className="w-full h-14 btn-primary shadow-amber-500/25 text-sm font-black tracking-widest">DASHBOARD EXIT <i className="fas fa-home ml-2"></i></button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    {% endraw %}
    </script>
</body>
</html>
